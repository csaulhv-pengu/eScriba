[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "escriba"
version = "0.1.0"
description = "Escriba - Writing and story structure tool"
authors = [
  { name="Cris", email="csaulhv@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]